# docker-compose.host.yml —— host 网络模式
#
# 四个模式各对应一份**完整独立**的 compose 文件，互不叠加：
#   docker-compose.yml            bridge（默认，`docker compose up -d` 零改动）
#   docker-compose.host.yml       host ← 本文件
#   docker-compose.ipvlan.yml     ipvlan（IPv6 走 RA/SLAAC）
#   docker-compose.macvlan.yml    macvlan（IPv6 走 RA/SLAAC）
#
# 启动：docker compose -f docker-compose.host.yml up -d
#   或：WGP_NETWORK_MODE=host ./scripts/up.sh
#
# host 模式：容器与宿主共享网络栈。面板监听宿主 8080/udp 51820，
# 入站源地址保留真实 IP（bridge 模式下经 NAT 会变成网关地址）。
#
# ⚠️ 与 bridge 文件的两处硬性差异：
#   1. 不能有 ports 映射——host 网络下没有端口转换这一层，写了会被 daemon 拒绝；
#   2. 不能有 sysctls 段——/proc/sys 与宿主共享，runc 以
#      "not allowed in host network namespace" 拒绝创建。
#      转发开关归属宿主（sysctl -w net.ipv4.ip_forward=1），面板只读不写。

services:
  wgpanel:
    image: ${WGP_IMAGE:-ghcr.io/rewind2026/wgpanel:latest}
    container_name: wgpanel
    restart: unless-stopped

    network_mode: host

    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - DAC_OVERRIDE

    devices:
      - /dev/net/tun:/dev/net/tun

    volumes:
      - type: volume
        source: wgpanel-data
        target: /data

    environment:
      WGP_DATA_DIR: /data
      WGP_LISTEN_ADDR: 0.0.0.0:8080
      WGP_INTERFACE: wg0
      WGP_LISTEN_PORT: "51820"
      WGP_ADDRESS_CIDR: 10.8.0.1/24
      WGP_MTU: "1420"
      WGP_DNS: 1.1.1.1,8.8.8.8
      # 模式由**文件**决定，不接受 .env 覆盖：
      # 网络由文件决定，变量必须服从文件，否则会出现「容器在 host netns 里、
      # 面板却按 bridge 分支跑」的错位（转发开关/NAT 语义全部错乱）。
      WGP_NATIVE_MODE: host
      WGP_SAMPLE_INTERVAL: 1s
      WGP_LOG_LEVEL: info
      WGP_LOG_FORMAT: console
      WGP_COOKIE_SECURE: ${WGP_COOKIE_SECURE:-0}
      WGP_TRUSTED_PROXY: ${WGP_TRUSTED_PROXY:-}
      WGP_ADMIN_USERNAME: ${WGP_ADMIN_USERNAME:-admin}
      WGP_ADMIN_PASSWORD: ${WGP_ADMIN_PASSWORD:-}
      WGP_PUBLIC_ENDPOINT: ${WGP_PUBLIC_ENDPOINT:-}
      TZ: ${TZ:-UTC}

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # 显式 name：与目录名解耦。目录改名后 compose 不会静默新建空卷导致数据「丢失」。
  wgpanel-data:
    name: wgpanel-data
