apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# base 只包含不含密钥的资源。
# 管理员口令由 overlay 通过 secretGenerator 注入，避免把
# CHANGE_ME 之类的占位值当成真实凭据 apply 到集群。
resources:
  - deployment.yaml
  - service.yaml
  - pvc.yaml

namespace: wgpanel

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: wgpanel