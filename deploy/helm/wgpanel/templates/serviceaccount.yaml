{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "wgpanel.serviceAccountName" . }}
  labels:
    {{- include "wgpanel.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# 面板不调用 Kubernetes API，刻意不挂任何 RBAC 权限。
{{- end }}