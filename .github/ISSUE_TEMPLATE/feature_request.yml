name: 功能建议
description: 提出新功能或改进
title: "[feat] "
labels: ["enhancement", "待讨论"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 先说现状哪里别扭，再说想要什么。需求比方案重要。
      placeholder: |
        现在客户端配额超限后只能手动去列表页逐个启用，20 个客户端要点 20 次。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的用法
      description: 界面上的操作路径，或 API 的调用方式
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的其他方案
      description: 哪怕是笨办法，也说明你已经想过
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: 影响面
      description: 用于判断这个需求会牵动多少代码
      options:
        - 仅前端
        - 仅后端
        - 前后端 + 数据模型（需要迁移）
        - 需要改动部署形态（Dockerfile / Helm / 权限）
    validations:
      required: true