version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # 间接依赖成组升级，避免一次安全更新带来几十个噪音 PR。
      indirect:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # React 与 React Router 必须同步升级，拆开必然冲突。
      react:
        patterns:
          - "react*"
        update-types:
          - minor
          - patch
      # Vite 与 @vitejs/plugin-react 通过 peerDependencies 绑定：
      # plugin-react 6.x 要求 vite ^8，vite 8 又要求 plugin-react 的 peer 覆盖到 8。
      # 拆开升级必然在 npm ci 阶段 ERESOLVE，必须成组。
      vite:
        patterns:
          - "vite"
          - "@vitejs/plugin-react"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"